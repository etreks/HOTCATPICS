    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: #111;
      overflow: hidden;
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    /* ── mobile shell ── */
    #app {
      position: relative;
      width: 100%;
      max-width: 430px;
      height: 100dvh;
      margin: 0 auto;
      background: #fff;
      overflow: hidden;
    }

    /* ════════════════════════
       SCREEN 1 — LOADING
    ════════════════════════ */
    #loading {
      position: absolute;
      inset: 0;
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 30;
      transition: opacity 0.55s ease;
    }
    #loading.hide { opacity: 0; pointer-events: none; }
    #loading h1 {
      font-family: 'HeimatMono', monospace;
      font-weight: 400;
      font-size: 22px;
      letter-spacing: 0.08em;
      color: #000;
    }

    /* ════════════════════════
       SCREEN 2 — FEED
    ════════════════════════ */
    #feed {
      position: absolute;
      inset: 0;
      background: #fff;
      display: flex;
      flex-direction: column;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.45s ease 0.2s;
      z-index: 10;
    }
    #feed.show { opacity: 1; pointer-events: all; }

    /* search bar */
    .search-bar {
      flex-shrink: 0;
      padding: 12px 16px 10px;
      background: #fff;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .profile-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      overflow: hidden;
      flex-shrink: 0;
      cursor: pointer;
      background: #eee;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 0 0px transparent;
      transition: box-shadow 0.25s cubic-bezier(0.4, 0, 0.2, 1), transform 0.15s ease;
      box-sizing: border-box;
    }
    .profile-avatar.has-ring,
    .profile-avatar:active {
      box-shadow: 0 0 0 2px #fff, 0 0 0 4px #000;
      transform: scale(0.96);
    }
    .profile-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .search-inner {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 10px;
      background: #f2f2f2;
      border-radius: 24px;
      padding: 10px 16px;
    }
    .search-inner svg { flex-shrink: 0; color: #888; }
    .search-inner input {
      flex: 1;
      border: none;
      background: none;
      outline: none;
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      font-size: 14px;
      color: #333;
    }
    .search-inner input::placeholder { color: #999; }

    /* masonry grid */
    .grid-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 6px 10px 24px;
      -webkit-overflow-scrolling: touch;
    }
    .grid-scroll::-webkit-scrollbar { display: none; }
    .masonry { columns: 2; column-gap: 8px; }
    .card {
      break-inside: avoid;
      margin-bottom: 8px;
      border-radius: 12px;
      overflow: hidden;
      background: #f5f5f5;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    .card:active { opacity: 0.82; }
    .card img { width: 100%; display: block; object-fit: cover; }

    /* ════════════════════════
       SCREEN 3 — POST DETAIL
    ════════════════════════ */
    #detail {
      position: absolute;
      inset: 0;
      background: #fff;
      display: flex;
      flex-direction: column;
      z-index: 20;
      transform: translateX(100%);
      transition: transform 0.32s cubic-bezier(0.4, 0, 0.2, 1);
      overflow: hidden;
    }
    #detail.open { transform: translateX(0); }

    .detail-scroll {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }
    .detail-scroll::-webkit-scrollbar { display: none; }

    /* back button */
    .detail-back {
      position: absolute;
      top: 16px;
      left: 16px;
      z-index: 5;
      background: none;
      border: none;
      cursor: pointer;
      font-size: 22px;
      color: #000;
      padding: 4px;
      line-height: 1;
    }

    /* hero image & carousel slider — full, no crop */
    .detail-carousel-wrapper {
      position: relative;
      width: 100%;
      background: #fff;
      overflow: hidden;
    }
    .detail-carousel {
      display: flex;
      width: 100%;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    .detail-carousel::-webkit-scrollbar { display: none; }

    .carousel-slide {
      flex: 0 0 100%;
      width: 100%;
      scroll-snap-align: start;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-sizing: border-box;
      background: #fff;
    }

    .detail-hero {
      width: 100%;
      display: block;
      object-fit: contain;
    }

    /* item showcase slide styling — size matches parent post, clean light bg */
    .item-showcase-slide {
      width: 100%;
      height: 100%;
      box-sizing: border-box;
      padding: 32px 20px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #f8f8f8;
      position: relative;
    }
    .item-showcase-img-container {
      width: 100%;
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
    }
    .item-showcase-img {
      max-width: 220px;
      max-height: 250px;
      object-fit: contain;
      filter: drop-shadow(0 8px 18px rgba(0,0,0,0.06));
    }
    .item-showcase-title {
      font-size: 14px;
      font-weight: 700;
      color: #000;
      text-align: center;
      margin-bottom: 4px;
      padding: 0 10px;
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    }

    /* add to collection button & morphing animation */
    .add-to-collection-btn {
      position: absolute;
      top: 16px;
      right: 16px;
      z-index: 6;
      height: 36px;
      padding: 0 14px;
      background: #eaeaec;
      border: 1px solid #d4d4d8;
      border-radius: 8px;
      color: #111;
      font-size: 13px;
      font-weight: 500;
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      white-space: nowrap;
      transition: width 0.45s cubic-bezier(0.4, 0, 0.2, 1),
                  height 0.45s cubic-bezier(0.4, 0, 0.2, 1),
                  padding 0.45s cubic-bezier(0.4, 0, 0.2, 1),
                  border-radius 0.45s cubic-bezier(0.4, 0, 0.2, 1),
                  background 0.3s ease,
                  border-color 0.3s ease;
      overflow: hidden;
      box-sizing: border-box;
    }

    .add-to-collection-btn .btn-text {
      display: inline-block;
      max-width: 160px;
      opacity: 1;
      transition: max-width 0.4s ease, opacity 0.3s ease;
    }

    .add-to-collection-btn .btn-icon {
      font-size: 20px;
      font-weight: 400;
      line-height: 1;
      display: none;
    }

    /* Morphed state: circular + button */
    .add-to-collection-btn.morphed {
      width: 40px;
      height: 40px;
      padding: 0;
      border-radius: 50%;
      background: transparent;
      border: 1px solid #333;
    }
    .add-to-collection-btn.morphed .btn-text {
      max-width: 0;
      opacity: 0;
      pointer-events: none;
    }
    .add-to-collection-btn.morphed .btn-icon {
      display: block;
    }

    /* Saved state (after click) */
    .add-to-collection-btn.saved {
      background: #000 !important;
      border-color: #000 !important;
      color: #fff !important;
    }

    /* dots indicator bar */
    .carousel-dots-bar {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px 0 8px;
      background: #fff;
    }
    .carousel-dots {
      display: flex;
      gap: 7px;
    }
    .carousel-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #d4d4d8;
      transition: background 0.25s, transform 0.25s;
    }
    .carousel-dot.active {
      background: #000;
      transform: scale(1.2);
    }

    /* swipe hint pill */
    .carousel-swipe-hint {
      position: absolute;
      right: 12px;
      bottom: 12px;
      background: rgba(0, 0, 0, 0.75);
      color: #fff;
      font-size: 11px;
      font-weight: 600;
      padding: 5px 11px;
      border-radius: 14px;
      z-index: 4;
      pointer-events: none;
      transition: opacity 0.3s;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    /* toast notification */
    #toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: rgba(0, 0, 0, 0.9);
      color: #fff;
      font-size: 13px;
      font-weight: 500;
      padding: 10px 20px;
      border-radius: 20px;
      z-index: 999;
      opacity: 0;
      transition: transform 0.3s ease, opacity 0.3s ease;
      pointer-events: none;
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    }
    #toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    /* meta row: @user, tags, buy now */
    .detail-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 14px 10px;
      border-bottom: 1px solid #f0f0f0;
    }
    .detail-user-block { display: flex; align-items: center; gap: 10px; }
    .detail-avatar {
      width: 34px; height: 34px;
      border-radius: 50%;
      background: #e0e0e0;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .detail-avatar svg { color: #aaa; }
    .detail-username {
      font-size: 13px;
      font-weight: 600;
      color: #000;
    }
    .detail-tags {
      font-size: 12px;
      color: #888;
      margin-top: 2px;
    }
    .buy-btn {
      background: #000;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 10px 18px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.06em;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
    }

    /* related posts section */
    .related-section { padding: 16px 10px 30px; }
    .related-grid { columns: 2; column-gap: 8px; }
    .related-card {
      break-inside: avoid;
      margin-bottom: 8px;
      border-radius: 10px;
      overflow: hidden;
      background: #f5f5f5;
      cursor: pointer;
    }
    .related-card img { width: 100%; display: block; object-fit: cover; }

    /* ════════════════════════
       SCREEN 4 — BUY NOW
    ════════════════════════ */
    #buyScreen {
      position: absolute;
      inset: 0;
      background: #fff;
      display: flex;
      flex-direction: column;
      z-index: 25;
      transform: translateX(100%);
      transition: transform 0.32s cubic-bezier(0.4, 0, 0.2, 1);
      overflow: hidden;
    }
    #buyScreen.open { transform: translateX(0); }

    .buy-scroll {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding-bottom: 80px;
    }
    .buy-scroll::-webkit-scrollbar { display: none; }

    /* back btn reused same class */
    .buy-back {
      position: absolute;
      top: 16px;
      left: 16px;
      z-index: 5;
      background: none;
      border: none;
      cursor: pointer;
      font-size: 22px;
      color: #000;
      padding: 4px;
      line-height: 1;
    }

    .buy-hero {
      width: 100%;
      display: block;
      object-fit: contain;
    }

    .buy-username {
      font-size: 13px;
      font-weight: 500;
      color: #000;
      padding: 10px 14px 12px;
      border-bottom: 1px solid #f0f0f0;
    }

    /* item rows */
    .buy-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px;
      border-bottom: 1px solid #f0f0f0;
      gap: 12px;
    }
    .buy-item-left { flex: 1; }
    .buy-item-name {
      font-size: 14px;
      font-weight: 600;
      color: #000;
      margin-bottom: 4px;
    }
    .buy-item-price {
      font-size: 13px;
      color: #444;
    }
    .buy-item-thumb {
      width: 56px;
      height: 56px;
      border-radius: 8px;
      object-fit: cover;
      background: #f5f5f5;
      flex-shrink: 0;
    }

    /* sticky done button */
    .buy-done-bar {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      padding: 12px 14px;
      background: #fff;
    }
    .buy-done-btn {
      width: 100%;
      height: 52px;
      background: #000;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;

  <script>
    // ── posts data ──
    const itemsPost1 = [
      { name: 'Cover: Iphone 14 Silicon – Beige',     price: 400, img: 'Assets/Items/case_beige.png' },
      { name: 'Sticker: "Hello" Miles Graffiti',      price: 50,  img: 'Assets/Items/sticker_hello_miles.png' },
      { name: 'Sticker: Spider Punk',                  price: 70,  img: 'Assets/Items/sticker_spiderpunk.png' },
      { name: 'Charm: Little Aid charm by @lya',      price: 30,  img: 'Assets/Items/charm_cat.jpg' },
    ];
    const itemsPost2 = [
      { name: 'Cover: Wave Case – Burgundy',           price: 480, img: 'Assets/POSTS/post2.png' },
      { name: 'Charm: Pearl Beaded Strap',             price: 90,  img: 'Assets/POSTS/post2.png' },
    ];
    const itemsPost3 = [
      { name: 'Cover: Clear Marimekko Flower',         price: 520, img: 'Assets/POSTS/post3.png' },
      { name: 'Charm: Pink Flower Loop',               price: 60,  img: 'Assets/POSTS/post3.png' },
    ];

    const posts = [
      { src: 'Assets/POSTS/post1.png', user: '@satyeks', tags: '#spider #spidey...', items: itemsPost1 },
      { src: 'Assets/POSTS/post2.png', user: '@satyeks', tags: '#pearl #burgundy...', items: itemsPost2 },
      { src: 'Assets/POSTS/post3.png', user: '@satyeks', tags: '#flower #clear...', items: itemsPost3 },
      { src: 'Assets/POSTS/post1.png', user: '@satyeks', tags: '#spider #spidey...', items: itemsPost1 },
      { src: 'Assets/POSTS/post3.png', user: '@satyeks', tags: '#flower #clear...', items: itemsPost3 },
      { src: 'Assets/POSTS/post2.png', user: '@satyeks', tags: '#pearl #burgundy...', items: itemsPost2 },
      { src: 'Assets/POSTS/post3.png', user: '@satyeks', tags: '#flower #clear...', items: itemsPost3 },
      { src: 'Assets/POSTS/post1.png', user: '@satyeks', tags: '#spider #spidey...', items: itemsPost1 },
    ];

    // ── build feed grid ──
    const grid = document.getElementById('grid');
    posts.forEach((p, i) => {
      const card = document.createElement('div');
      card.className = 'card';
      const img = document.createElement('img');
      img.src = p.src;
      img.loading = 'lazy';
      card.appendChild(img);
      card.addEventListener('click', () => openDetail(p));
      grid.appendChild(card);
    });

    // ── profile avatar click -> toggle black ring ──
    const profileAvatarBtn = document.getElementById('profileAvatarBtn');
    if (profileAvatarBtn) {
      profileAvatarBtn.addEventListener('click', () => {
        profileAvatarBtn.classList.toggle('has-ring');
        showToast('@satyeks profile');
      });
    }


    // ── collection store ──
    const CollectionStore = {
      KEY: 'hotcat_collection_items',
      getAll() {
        try { return JSON.parse(localStorage.getItem(this.KEY) || '[]'); }
        catch(e) { return []; }
      },
      add(item) {
        const list = this.getAll();
        if (!list.some(i => i.name === item.name)) {
          list.push({ ...item, savedAt: Date.now() });
          localStorage.setItem(this.KEY, JSON.stringify(list));
        }
      },
      remove(itemName) {
        const list = this.getAll().filter(i => i.name !== itemName);
        localStorage.setItem(this.KEY, JSON.stringify(list));
      },
      has(itemName) {
        return this.getAll().some(i => i.name === itemName);
      }
    };

    function showToast(msg) {
      let toast = document.getElementById('toast');
      if (!toast) {
        toast = document.createElement('div');
        toast.id = 'toast';
        document.body.appendChild(toast);
      }
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2000);
    }

    // ── detail screen & carousel slider ──
    const detail         = document.getElementById('detail');
    const detailHero     = document.getElementById('detailHero');
    const detailCarousel = document.getElementById('detailCarousel');
    const carouselDots   = document.getElementById('carouselDots');
    const swipeHint      = document.getElementById('swipeHint');
    const detailUser     = document.getElementById('detailUser');
    const detailTags     = document.getElementById('detailTags');
    const relatedGrid    = document.getElementById('relatedGrid');
    const backBtn        = document.getElementById('backBtn');

    function openDetail(post) {
      // hero main image
      detailHero.src = post.src;
      detailUser.textContent = post.user;
      detailTags.textContent = post.tags;

      // remove previous item showcase slides & dots
      const itemSlides = detailCarousel.querySelectorAll('.item-showcase-slide-wrapper');
      itemSlides.forEach(el => el.remove());
      carouselDots.innerHTML = '';

      const items = post.items || [];
      const totalSlides = 1 + items.length;

      // Dot 1 for main post image
      const dot1 = document.createElement('div');
      dot1.className = 'carousel-dot active';
      carouselDots.appendChild(dot1);

      // Create item slides matching parent post height
      items.forEach((item, idx) => {
        const slideWrapper = document.createElement('div');
        slideWrapper.className = 'carousel-slide item-showcase-slide-wrapper';

        const isSaved = CollectionStore.has(item.name);

        slideWrapper.innerHTML = `
          <div class="item-showcase-slide">
            <button class="add-to-collection-btn ${isSaved ? 'saved morphed' : ''}" data-idx="${idx}">
              <span class="btn-text">${isSaved ? 'saved' : 'add it to collection'}</span>
              <span class="btn-icon">${isSaved ? '&#10003;' : '+'}</span>
            </button>
            <div class="item-showcase-img-container">
              <img class="item-showcase-img" src="${item.img}" alt="${item.name}" loading="lazy" />
            </div>
            <div class="item-showcase-title">${item.name}</div>
          </div>
        `;

        const btn = slideWrapper.querySelector('.add-to-collection-btn');
        btn.onclick = (e) => {
          e.stopPropagation();
          if (CollectionStore.has(item.name)) {
            CollectionStore.remove(item.name);
            btn.classList.remove('saved');
            btn.querySelector('.btn-icon').textContent = '+';
            if (!btn.classList.contains('morphed')) {
              btn.querySelector('.btn-text').textContent = 'add it to collection';
            }
            showToast('Removed from collection');
          } else {
            CollectionStore.add(item);
            btn.classList.add('saved');
            btn.querySelector('.btn-icon').textContent = '✓';
            showToast('Saved to collection');
          }
        };

        detailCarousel.appendChild(slideWrapper);

        const dot = document.createElement('div');
        dot.className = 'carousel-dot';
        carouselDots.appendChild(dot);
      });

      // Adjust slide wrapper height to match main hero height dynamically
      setTimeout(() => {
        const heroHeight = detailHero.clientHeight || 420;
        const wrappers = detailCarousel.querySelectorAll('.item-showcase-slide-wrapper');
        wrappers.forEach(w => {
          w.style.height = `${heroHeight}px`;
        });
      }, 50);

      // reset scroll position & hint
      detailCarousel.scrollLeft = 0;
      if (swipeHint) {
        swipeHint.style.opacity = totalSlides > 1 ? '1' : '0';
      }

      // related: for now show same post repeated in 2-col grid
      relatedGrid.innerHTML = '';
      for (let i = 0; i < 4; i++) {
        const rc = document.createElement('div');
        rc.className = 'related-card';
        const ri = document.createElement('img');
        ri.src = post.src;
        ri.loading = 'lazy';
        rc.appendChild(ri);
        relatedGrid.appendChild(rc);
      }

      // wire up BUY NOW button with current post
      document.querySelector('.buy-btn').onclick = () => openBuy(post);

      // scroll detail back to top then slide in
      detail.querySelector('.detail-scroll').scrollTop = 0;
      detail.classList.add('open');
    }

    // Carousel scroll listener to update active dot & trigger morphing animation
    detailCarousel.addEventListener('scroll', () => {
      const slideWidth = detailCarousel.clientWidth || 1;
      const index = Math.round(detailCarousel.scrollLeft / slideWidth);
      const dots = carouselDots.querySelectorAll('.carousel-dot');
      dots.forEach((dot, idx) => {
        dot.classList.toggle('active', idx === index);
      });
      if (swipeHint && detailCarousel.scrollLeft > 20) {
        swipeHint.style.opacity = '0';
      }

      // Trigger morph animation from 'add it to collection' -> '+' on active item slide
      if (index > 0) {
        const activeWrapper = detailCarousel.querySelectorAll('.item-showcase-slide-wrapper')[index - 1];
        if (activeWrapper) {
          const btn = activeWrapper.querySelector('.add-to-collection-btn');
          if (btn && !btn.classList.contains('morphed')) {
            setTimeout(() => {
              btn.classList.add('morphed');
            }, 650);
          }
        }
      }
    });

    // Touch swipe gesture support for swiping right-to-left
    let touchStartX = 0;
    let touchStartY = 0;
    detailCarousel.addEventListener('touchstart', e => {
      touchStartX = e.touches[0].clientX;
      touchStartY = e.touches[0].clientY;
    }, { passive: true });

    detailCarousel.addEventListener('touchend', e => {
      const deltaX = e.changedTouches[0].clientX - touchStartX;
      const deltaY = e.changedTouches[0].clientY - touchStartY;
      if (Math.abs(deltaX) > Math.abs(deltaY) && Math.abs(deltaX) > 30) {
        const slideWidth = detailCarousel.clientWidth || 1;
        const currentIdx = Math.round(detailCarousel.scrollLeft / slideWidth);
        if (deltaX < 0) { // swipe left (right to left)
          detailCarousel.scrollTo({ left: (currentIdx + 1) * slideWidth, behavior: 'smooth' });
        } else { // swipe right (left to right)
          detailCarousel.scrollTo({ left: (currentIdx - 1) * slideWidth, behavior: 'smooth' });
        }
      }
    }, { passive: true });

    // Desktop mouse drag support
    let isDragActive = false;
    let dragStartX = 0;
    let dragScrollLeft = 0;

    detailCarousel.addEventListener('mousedown', e => {
      isDragActive = true;
      dragStartX = e.pageX - detailCarousel.offsetLeft;
      dragScrollLeft = detailCarousel.scrollLeft;
    });
    detailCarousel.addEventListener('mouseleave', () => { isDragActive = false; });
    detailCarousel.addEventListener('mouseup', () => { isDragActive = false; });
    detailCarousel.addEventListener('mousemove', e => {
      if (!isDragActive) return;
      e.preventDefault();
      const x = e.pageX - detailCarousel.offsetLeft;
      const walk = (x - dragStartX) * 1.5;
      detailCarousel.scrollLeft = dragScrollLeft - walk;
    });

    backBtn.addEventListener('click', () => {
      detail.classList.remove('open');
    });

    // ── buy screen ──
    const buyScreen  = document.getElementById('buyScreen');
    const buyHero    = document.getElementById('buyHero');
    const buyUser    = document.getElementById('buyUser');
    const buyItemsList = document.getElementById('buyItemsList');
    const buyDoneBtn = document.getElementById('buyDoneBtn');
    const buyBackBtn = document.getElementById('buyBackBtn');

    function openBuy(post) {
      buyHero.src = post.src;
      buyUser.textContent = post.user;

      buyItemsList.innerHTML = '';
      let total = 0;
      (post.items || []).forEach(item => {
        total += item.price;
        const row = document.createElement('div');
        row.className = 'buy-item';
        row.innerHTML = `
          <div class="buy-item-left">
            <div class="buy-item-name">${item.name}</div>
            <div class="buy-item-price">&#8377; ${item.price}</div>
          </div>
          <img class="buy-item-thumb" src="${item.img}" loading="lazy" />
        `;
        buyItemsList.appendChild(row);
      });

      buyDoneBtn.textContent = `DONE – ₹${total}`;
      buyScreen.querySelector('.buy-scroll').scrollTop = 0;
      buyScreen.classList.add('open');

      // store current post for checkout
      buyScreen._currentPost = post;
      buyScreen._currentTotal = total;
    }

    buyBackBtn.addEventListener('click', () => {
      buyScreen.classList.remove('open');
    });

    // ────────────────────────────────────────────
    //  UserStore — persists user data to localStorage
    // ────────────────────────────────────────────
    const UserStore = {
      _key: 'hcp_user',
      _data: null,

      _load() {
        if (!this._data) {
          try { this._data = JSON.parse(localStorage.getItem(this._key)) || {}; }
          catch { this._data = {}; }
        }
        return this._data;
      },

      _save() {
        localStorage.setItem(this._key, JSON.stringify(this._data));
      },

      get(key)       { return this._load()[key] || ''; },
      set(key, val)  { this._load()[key] = val; this._save(); },
    };

    // ────────────────────────────────────────────
    //  InputSheet — reusable bottom-sheet for any text input
    // ────────────────────────────────────────────
    const inputSheet   = document.getElementById('inputSheet');
    const sheetTitle   = document.getElementById('sheetTitle');
    const sheetInput   = document.getElementById('sheetInput');
    const sheetSaveBtn = document.getElementById('sheetSaveBtn');
    const sheetBackdrop = document.getElementById('sheetBackdrop');
    let   _sheetOnSave = null;

    function openInputSheet({ title, placeholder, currentValue, onSave }) {
      sheetTitle.textContent   = title;
      sheetInput.placeholder   = placeholder;
      sheetInput.value         = currentValue || '';
      sheetInput.type          = placeholder.includes('phone') || placeholder.includes('number') ? 'tel' : 'text';
      _sheetOnSave             = onSave;
      inputSheet.classList.add('open');
      setTimeout(() => sheetInput.focus(), 350);
    }

    function closeInputSheet() {
      inputSheet.classList.remove('open');
      sheetInput.blur();
    }

    sheetSaveBtn.addEventListener('click', () => {
      const val = sheetInput.value.trim();
      if (val && _sheetOnSave) _sheetOnSave(val);
      closeInputSheet();
    });

    sheetBackdrop.addEventListener('click', closeInputSheet);

    // allow Enter key to save
    sheetInput.addEventListener('keydown', e => {
      if (e.key === 'Enter') sheetSaveBtn.click();
    });

    // ────────────────────────────────────────────
    //  Checkout screen wiring
    // ────────────────────────────────────────────
    const checkoutScreen = document.getElementById('checkoutScreen');
    const coSummaryRows  = document.getElementById('coSummaryRows');
    const coTotal        = document.getElementById('coTotal');
    const coBackBtn      = document.getElementById('coBackBtn');
    const addressSub     = document.getElementById('addressSub');
    const phoneSub       = document.getElementById('phoneSub');
    const addressRow     = document.getElementById('addressRow');
    const phoneRow       = document.getElementById('phoneRow');

    function refreshUserInfo() {
      const addr  = UserStore.get('address');
      const phone = UserStore.get('phone');
      addressSub.textContent = addr  || 'Tap to add your address';
      phoneSub.textContent   = phone || 'Tap to add your number';
    }

    addressRow.addEventListener('click', () => {
      openInputSheet({
        title: 'Delivery Address',
        placeholder: 'Enter your full address',
        currentValue: UserStore.get('address'),
        onSave: val => { UserStore.set('address', val); refreshUserInfo(); },
      });
    });

    phoneRow.addEventListener('click', () => {
      openInputSheet({
        title: 'Phone Number',
        placeholder: 'Enter your phone number',
        currentValue: UserStore.get('phone'),
        onSave: val => { UserStore.set('phone', val); refreshUserInfo(); },
      });
    });

    buyDoneBtn.addEventListener('click', () => {
      const post  = buyScreen._currentPost;
      const total = buyScreen._currentTotal || 0;

      coSummaryRows.innerHTML = '';
      (post?.items || []).forEach(item => {
        const row = document.createElement('div');
        row.className = 'co-summary-row';
        row.innerHTML = `<span>${item.name}</span><span>&#8377;${item.price}</span>`;
        coSummaryRows.appendChild(row);
      });

      coTotal.textContent = `₹${total + 100}`;
      refreshUserInfo();  // show saved address/phone
      checkoutScreen.querySelector('.co-scroll').scrollTop = 0;
      checkoutScreen.classList.add('open');
    });

    coBackBtn.addEventListener('click', () => {
      checkoutScreen.classList.remove('open');
    });

    // ────────────────────────────────────────────
    //  Payment screen
    // ────────────────────────────────────────────
    const paymentScreen = document.getElementById('paymentScreen');
    const pmBackBtn     = document.getElementById('pmBackBtn');
    const pmPayBtn      = document.getElementById('pmPayBtn');
    const coPayBtn      = document.getElementById('coPayBtn');

    let selectedMethod = 'apple'; // default

    function selectMethod(method) {
      selectedMethod = method;
      ['revolut','apple','gpay'].forEach(m => {
        const el = document.getElementById(`radio-${m}`);
        el.classList.toggle('selected', m === method);
      });
    }

    // set default selection
    selectMethod('apple');

    // wire radio rows
    document.querySelectorAll('.pm-row').forEach(row => {
      row.addEventListener('click', () => selectMethod(row.dataset.method));
    });

    coPayBtn.addEventListener('click', () => {
      paymentScreen.querySelector('.pm-scroll').scrollTop = 0;
      paymentScreen.classList.add('open');
    });

    pmBackBtn.addEventListener('click', () => {
      paymentScreen.classList.remove('open');
    });

    pmPayBtn.addEventListener('click', () => {
      // TODO: integrate real payment gateway here
      // For now: store selected method and show confirmation
      UserStore.set('paymentMethod', selectedMethod);
      alert(`Order placed via ${selectedMethod}! \u2705`);
    });

    // ── loading → feed ──
    const loading = document.getElementById('loading');
    const feed    = document.getElementById('feed');
    setTimeout(() => {
      loading.classList.add('hide');
      feed.classList.add('show');
    }, 1400);
  </script>
</body>
</html>
